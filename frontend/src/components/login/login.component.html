<section class="login-section">
  <div class="container">
    <div class="form-container">
      <div class="text-center mb-8">
        <h1 class="section-title">Connexion</h1>
        <p class="section-subtitle">Connectez-vous pour enchérir sur vos articles préférés</p>
      </div>

      <div class="form-card">
        <!-- Message de succès -->
        <div *ngIf="successMessage" class="success-message">
          {{ successMessage }}
        </div>

        <form (submit)="onSubmit($event)" class="form">
          <div class="form-group">
            <label for="email" class="form-label">Email</label>
            <input
              id="email"
              type="email"
              placeholder="votre@email.com"
              [(ngModel)]="email"
              name="email"
              class="form-input"
              required
            />
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Mot de passe</label>
            <input
              id="password"
              type="password"
              placeholder="••••••••"
              [(ngModel)]="password"
              name="password"
              class="form-input"
              required
            />
          </div>

          <div *ngIf="error" class="error-message">
            {{ error }}
          </div>

          <button
            type="submit"
            class="submit-button"
            [disabled]="loading"
          >
            {{ loading ? "Connexion..." : "Se connecter" }}
          </button>
        </form>

        <div class="form-footer">
          <p class="footer-text">
            Pas encore de compte ?
            <a [routerLink]="['/inscription']" class="footer-link">
              Créer un compte
            </a>
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
