<section class="signup-section">
  <div class="container">
    <div class="form-container">
      <div class="text-center mb-8">
        <h1 class="section-title">Inscription</h1>
        <p class="section-subtitle">Créez votre compte pour commencer à enchérir</p>
      </div>

      <div class="form-card">
        <form (submit)="onSubmit($event)" class="form">
          <!-- Première ligne : 3 colonnes -->
          <div class="form-row">
            <div class="form-group">
              <label for="nom" class="form-label">Nom *</label>
              <input
                id="nom"
                type="text"
                placeholder="Votre nom"
                [(ngModel)]="nom"
                name="nom"
                class="form-input"
                required
              />
            </div>

            <div class="form-group">
              <label for="prenom" class="form-label">Prénom *</label>
              <input
                id="prenom"
                type="text"
                placeholder="Votre prénom"
                [(ngModel)]="prenom"
                name="prenom"
                class="form-input"
                required
              />
            </div>

            <div class="form-group">
              <label for="email" class="form-label">Email *</label>
              <input
                id="email"
                type="email"
                placeholder="votre@email.com"
                [(ngModel)]="email"
                name="email"
                class="form-input"
                required
              />
            </div>
          </div>

          <!-- Deuxième ligne : 3 colonnes -->
          <div class="form-row">
            <div class="form-group">
              <label for="tel" class="form-label">Téléphone</label>
              <input
                id="tel"
                type="tel"
                placeholder="+212 6 12 34 56 78"
                [(ngModel)]="tel"
                name="tel"
                class="form-input"
              />
            </div>

            <div class="form-group">
              <label for="pays" class="form-label">Pays *</label>
              <select
                id="pays"
                [(ngModel)]="pays"
                name="pays"
                class="form-input"
                required
              >
                <option value="">Sélectionnez votre pays</option>
                <option value="Maroc">Maroc</option>
                <option value="France">France</option>
                <option value="Canada">Canada</option>
                <option value="Belgique">Belgique</option>
                <option value="Autre">Autre</option>
              </select>
            </div>

            <div class="form-group">
              <label for="ville" class="form-label">Ville *</label>
              <input
                id="ville"
                type="text"
                placeholder="Votre ville"
                [(ngModel)]="ville"
                name="ville"
                class="form-input"
                required
              />
            </div>
          </div>

          <!-- Troisième ligne : Photo de profil upload + Mots de passe -->
          <div class="form-row">
            <div class="form-group">
              <label for="photoprofil" class="form-label">Photo de profil</label>
              <div class="file-upload-container">
                <input
                  id="photoprofil"
                  type="file"
                  (change)="onFileSelected($event)"
                  accept="image/*"
                  class="file-input"
                />
                <label for="photoprofil" class="file-upload-label">
                  <span class="file-upload-text">Choisir une photo</span>
                  <span class="file-upload-icon">📷</span>
                </label>
                <div *ngIf="photoprofil" class="file-selected">
                  {{ photoprofil }}
                </div>
              </div>
              <small class="form-help">Formats supportés: JPG, PNG, GIF</small>
            </div>

            <div class="form-group">
              <label for="password" class="form-label">Mot de passe *</label>
              <input
                id="password"
                type="password"
                placeholder="••••••••"
                [(ngModel)]="password"
                name="password"
                class="form-input"
                required
                minlength="6"
              />
              <small class="form-help">Minimum 6 caractères</small>
            </div>

            <div class="form-group">
              <label for="confirmPassword" class="form-label">Confirmer le mot de passe *</label>
              <input
                id="confirmPassword"
                type="password"
                placeholder="••••••••"
                [(ngModel)]="confirmPassword"
                name="confirmPassword"
                class="form-input"
                required
              />
            </div>
          </div>

          <!-- Message d'erreur -->
          <div *ngIf="error" class="error-message">
            {{ error }}
          </div>

          <!-- Bouton de soumission plus petit -->
          <button
            type="submit"
            class="submit-button compact"
            [disabled]="loading"
          >
            {{ loading ? "Création..." : "Créer mon compte" }}
          </button>
        </form>

        <div class="form-footer">
          <p class="footer-text">
            Déjà un compte ?
            <a routerLink="/connexion" class="footer-link">
              Se connecter
            </a>
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
