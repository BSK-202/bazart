<header class="header">
  <div class="container">
    <div class="header-content">
      <!-- Logo -->
      <a routerLink="/" class="logo flex items-center gap-4">
        <img src="assets/icon-bazart.png" alt="Bazart Logo" class="logo-img" />

        <h1 class="logo-text">
          Bazart<span class="logo-dot">.</span>
        </h1>
      </a>


      <!-- Navigation -->
      <nav class="navigation">
        <a routerLink="/"
           class="nav-link"
           [class.active]="currentRoute === '/'"
           routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: true }">Accueil</a>

        <a routerLink="/vendre"
           class="nav-link"
           [class.active]="currentRoute === '/vendre'"
           routerLinkActive="active">Vendre</a>

        <a routerLink="/encheres"
           class="nav-link"
           [class.active]="currentRoute === '/encheres'"
           routerLinkActive="active">Enchères</a>

        <a routerLink="/categories"
           class="nav-link"
           [class.active]="currentRoute === '/categories'"
           routerLinkActive="active">Catégories</a>

        <a routerLink="/wallet"
           class="nav-link"
           [class.active]="currentRoute === '/wallet'"
           routerLinkActive="active">My Wallet</a>

        <!-- Expert -->
        <a *ngIf="isExpert && isExpertActive"
           routerLink="/expertiser"
           class="nav-link"
           [class.active]="currentRoute === '/expertiser'"
           routerLinkActive="active">Expertiser</a>

        <a routerLink="/contact"
           class="nav-link"
           [class.active]="currentRoute === '/contact'"
           routerLinkActive="active">Contact</a>
      </nav>

      <!-- Actions -->
      <div class="actions">
        <!-- Recherche -->
        <button class="icon-button"
                [class.active]="currentRoute === '/recherche'"
                aria-label="Recherche"
                routerLink="/recherche">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </button>

        <ng-container *ngIf="isAuthenticated">
          <!-- Icône cœur qui redirige vers les favoris -->
          <button class="icon-button"
                  [class.active]="isFavoritesActive"
                  aria-label="Favoris"
                  (click)="navigateToProfileSection('favorites')">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
            </svg>
          </button>

          <app-notification [userId]="user?.id ?? null"></app-notification>

          <!-- Menu utilisateur connecté -->
          <div class="user-menu">
            <div class="user-dropdown">
              <button class="user-trigger icon-button"
                      aria-label="Profil utilisateur"
                      (click)="toggleDropdown()">
                <div class="profile-image-container">
                  <!-- Afficher l'image seulement si showProfileImage est true -->
                  <img *ngIf="showProfileImage && userProfileImage"
                       [src]="userProfileImage"
                       alt="Photo de profil"
                       class="profile-image"
                       (error)="onImageError()">
                  <!-- Icône par défaut si l'image n'existe pas -->
                  <svg *ngIf="!showProfileImage || !userProfileImage" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                  </svg>
                </div>
              </button>
              <div class="dropdown-content" [class.show]="isDropdownOpen">

                <div class="user-info-with-image">
                  <div class="user-avatar-container">
                    <img *ngIf="showProfileImage && userProfileImage"
                         [src]="userProfileImage"
                         alt="Photo de profil"
                         class="user-avatar"
                         (error)="onImageError()">
                    <svg *ngIf="!showProfileImage || !userProfileImage" class="user-avatar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                  </div>
                  <div class="user-details">
                    <p class="user-name">{{ user?.name || 'Utilisateur' }}</p>
                    <p class="user-email">{{ user?.email || '' }}</p>
                  </div>
                </div>

                <!-- Badge Expert -->
                <div *ngIf="isExpert"
                     class="expert-badge"
                     [ngClass]="{ 'active': isExpertActive, 'pending': !isExpertActive }">
                  <ng-container *ngIf="isExpertActive">⭐ Expert</ng-container>
                  <ng-container *ngIf="!isExpertActive">⏳ Validation en cours</ng-container>
                </div>

                <div class="dropdown-separator"></div>

                <!-- Menu Items -->
                <a routerLink="/profil" class="dropdown-item" (click)="closeDropdown()">Mon profil</a>
                <a class="dropdown-item" (click)="navigateToProfileSection('bids')">Mes enchères</a>
                <a class="dropdown-item" (click)="navigateToProfileSection('favorites')">Mes favoris</a>

                <!-- Option Devenir Expert -->
                <a *ngIf="!isExpert"
                   class="dropdown-item"
                   (click)="goToBecomeExpert()">
                  Devenir expert
                </a>

                <div class="dropdown-separator"></div>

                <button class="dropdown-item logout" (click)="logout()">
                  <svg class="logout-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                  </svg>
                  Déconnexion
                </button>
              </div>
            </div>
          </div>
        </ng-container>

        <!-- Bouton de connexion (seulement si NON connecté) -->
        <ng-container *ngIf="!isAuthenticated">
          <button class="icon-button" aria-label="Connexion" routerLink="/connexion">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
          </button>
        </ng-container>


      </div>
    </div>
  </div>
</header>
