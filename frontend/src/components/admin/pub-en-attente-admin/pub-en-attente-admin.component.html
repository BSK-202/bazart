<section class="pending-publications-section">
  <div class="container">
    <div class="text-center mb-12">
      <h1 class="section-title">Publications en Attente</h1>
      <p class="section-description">
        Gérer les produits en attente de validation
      </p>
    </div>

    <!-- Indicateur de chargement -->
    <div *ngIf="isLoading" class="loading-container">
      <div class="spinner"></div>
      <span class="loading-text">Chargement des publications...</span>
    </div>

    <!-- Message si aucune publication -->
    <div *ngIf="!isLoading && produits.length === 0" class="empty-state">
      <p class="empty-text">Aucune publication en attente pour le moment.</p>
    </div>

    <!-- Grille des produits -->
    <div *ngIf="!isLoading && produits.length > 0" class="products-grid">
      <div *ngFor="let produit of produits" class="product-card">
        <div class="product-image-container">
          <img
            [src]="getProductImageUrl(produit)"
            [alt]="produit.nom"
            class="product-image"
            (error)="onImageError($event)"
          />
          <div class="product-status">En attente</div>
        </div>

        <div class="product-content">
          <h3 class="product-name">{{ produit.nom }}</h3>


          <div class="product-details">
            <div class="price-range">
              <span class="price-label">Prix:</span>
              <span class="price-value">{{ produit.prixDebut }}DH </span>
            </div>
            <div class="category">
              <span class="category-label">Catégorie:</span>
              <span class="category-value">{{ produit.categorieNom }}</span>
            </div>
            <div class="vendeur">
              <span class="vendeur-label">Vendeur:</span>
              <span class="vendeur-value">{{ produit.vendeurNom }}</span>
            </div>
          </div>

          <div class="product-actions">
            <button class="btn-view-details" (click)="viewDetails(produit.id)">
              Voir détails
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
