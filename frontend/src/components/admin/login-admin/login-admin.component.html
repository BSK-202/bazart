
<div class="admin-login-container">
  <div class="admin-login-card">
    <!-- En-tête -->
    <div class="login-header">
      <h1 class="login-title">Espace Administrateur</h1>
      <p class="login-subtitle">Connectez-vous à votre compte administrateur</p>
    </div>

    <!-- Formulaire de connexion -->
    <form (ngSubmit)="onSubmit()" class="login-form">
      <!-- Champ Email -->
      <div class="form-group">
        <label for="email" class="form-label">Email Administrateur</label>
        <input
          id="email"
          type="email"
          [(ngModel)]="loginData.email"
          name="email"
          class="form-input"
          placeholder="admin@bazart.ma"
          required
          [disabled]="isLoading"
        />
      </div>

      <!-- Champ Mot de passe -->
      <div class="form-group">
        <label for="password" class="form-label">Mot de passe</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="loginData.motDePasse"
          name="motDePasse"
          class="form-input"
          placeholder="••••••••"
          required
          [disabled]="isLoading"
        />
      </div>

      <!-- Message d'erreur -->
      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <!-- Bouton de connexion -->
      <button
        type="submit"
        class="login-button"
        [disabled]="isLoading"
        [class.loading]="isLoading"
      >
        <span *ngIf="!isLoading">Se connecter</span>
        <span *ngIf="isLoading">Connexion en cours...</span>
      </button>
    </form>

    <!-- Lien de retour -->
    <div class="back-link">
      <a routerLink="/" class="back-button">
        ← Retour à l'accueil
      </a>
    </div>
  </div>
</div>
